name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src scripts tests
      - run: python -m ruff check src scripts tests
      - run: python -m pytest -q
      - run: python scripts/create_demo_dataset.py
      - run: python scripts/validate_dataset.py --config configs/demo.yaml --write-dataset-yaml
      - run: python scripts/verify_pages_demo.py
      - run: node --check docs/app.js