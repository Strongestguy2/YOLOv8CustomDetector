seed: 42
device: auto

project:
  id: demo_shapes
  name: Synthetic Shapes
  default_config: configs/demo.yaml
  created_at: built-in

classes:
  - shape

model:
  image_size: 128
  backbone: resnet34
  pretrained_backbone: false
  fpn_channels: 32
  head_channels: 32
  freeze_backbone_epochs: 0

data:
  source: synthetic
  root: data/demo_yolo
  auto_prepare: false
  state_path: data/demo_state.json
  train_samples: 1
  val_samples: 1
  seed: 42

augmentation:
  enabled: true
  hsv_h: 0.015
  hsv_s: 0.5
  hsv_v: 0.3
  hflip_p: 0.5

loss:
  obj_weight: 1.0
  cls_weight: 1.0
  box_weight: 5.0
  l1_weight: 0.25
  focal_alpha: 0.25
  focal_gamma: 2.0
  center_radius: 1

train:
  run_name: main
  output_dir: outputs/projects/demo_shapes/runs
  epochs: 2
  batch_size: 1
  val_batch_size: 1
  workers: 0
  pin_memory: false
  drop_last: false
  grad_accum: 1
  lr: 0.001
  min_lr_ratio: 0.1
  weight_decay: 0.0
  warmup_steps: 0
  total_steps: 20
  amp: false
  grad_clip_norm: 5.0
  checkpoint_steps: 5
  checkpoint_minutes: 60
  val_max_batches: 1
  vis_every_images: 1
  vis_max_images: 1
  vis_conf_threshold: 0.1
  vis_iou_threshold: 0.45
