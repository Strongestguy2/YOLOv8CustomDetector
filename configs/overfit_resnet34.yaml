seed: 42
device: auto

model:
  num_classes: 80
  image_size: 640
  backbone: resnet34
  pretrained_backbone: true
  fpn_channels: 128
  head_channels: 128
  freeze_backbone_epochs: 0

data:
  root: data/coco_yolo
  state_path: data/state.json
  train_samples: 20000
  val_samples: 500
  max_train_images: 256
  max_val_images: 256
  val_from_train: true
  seed: 42

augmentation:
  enabled: false
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.0
  hflip_p: 0.0

loss:
  obj_weight: 1.0
  cls_weight: 1.0
  box_weight: 5.0
  l1_weight: 0.25
  focal_alpha: 0.25
  focal_gamma: 2.0
  center_radius: 1

train:
  run_name: overfit_resnet34_256
  output_dir: outputs/runs
  epochs: 200
  batch_size: 12
  val_batch_size: 12
  workers: 4
  pin_memory: true
  drop_last: false
  grad_accum: 1
  lr: 0.0005
  min_lr_ratio: 0.2
  weight_decay: 0.0
  warmup_steps: 50
  total_steps: 3000
  amp: true
  grad_clip_norm: 10.0
  checkpoint_steps: 100
  checkpoint_minutes: 15
  val_max_batches: 22
  vis_every_images: 96
  vis_max_images: 4
  stop_file: C:\Users\user\test\outputs\panel\stop_requested.txt
  vis_conf_threshold: 0.25
  vis_iou_threshold: 0.45
